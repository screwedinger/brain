<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brain</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">BRAIN</div>
        <h1>Your browser <span>remembers.</span></h1>
        <p class="muted">A live view of what Brain has captured locally.</p>
      </div>
      <button id="refresh">Refresh</button>
    </header>

    <div class="stats">
      <section class="card"><div class="label">PAGES</div><strong id="pages">—</strong></section>
      <section class="card"><div class="label">VISITS</div><strong id="visits">—</strong></section>
      <section class="card"><div class="label">EVENTS</div><strong id="events">—</strong></section>
    </div>

    <section class="memory">
      <div class="section-head">
        <div><div class="label">RECENT ACTIVITY</div><h2>What happened</h2></div>
        <span id="updated">—</span>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="visits">Visits</button>
        <button class="tab" data-tab="pages">Pages</button>
        <button class="tab" data-tab="events">Events</button>
      </div>
      <div id="list" class="list"><div class="empty">Loading local memory…</div></div>
    </section>

    <section class="card privacy">
      <div class="label">LOCAL ONLY</div>
      <p>URLs, titles, timestamps, visit duration and browser events are stored locally. No cloud sync or AI processing is active.</p>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
